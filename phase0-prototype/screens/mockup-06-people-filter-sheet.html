<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup #6 — People Filter Sheet · Arkive Phase 0</title>
  <link rel="stylesheet" href="../css/arkive-midfi.css">
  <!--
    Mockup #6 — Global Moments feed: People filter UI (sheet state).
    Phase 0 mid-fi clickable prototype.

    Owner: Capsule Design Lead
    Consumes Person-chip primitive v1.1 row-identity variant from Profile Design Lead.

    Filter affordance pattern: SHEET (per Profile Lead Q4 answer, 2026-05-24).
      - Trailing filter button in Moments nav bar opens this sheet.
      - Sheet body renders full People list via row-identity primitive
        — same component used in Profile Lead's mockup #1 (People list).
      - Tap a Person row → sheet dismisses + feed reloads filtered
        + chip-filter pill renders above feed (visible in mockup #7).
      - Cancel returns to feed without filter applied.
      - Self at top per Spec #1 first-among-equals; uses 'you' italic
        hint in line 2 instead of connection_label (per spec §6).

    Rationale for sheet (not chip row): would be persistent chrome that
    doesn't earn its keep until filtering is invoked; scales gracefully
    to N Persons; surfaces Persons with zero moments (a chip row wouldn't);
    reuses the People list primitive — testers see the same row pattern
    in every "pick a Person" surface in the prototype.

    Hotspot graph from this screen:
      - Cancel button → mockup-05-moments-feed-default.html (close, no filter)
      - Scrim tap → mockup-05-moments-feed-default.html (close, no filter)
      - Alex row → mockup-07-filter-applied-alex.html (filter applied)
      - Other rows (Self, Liza, Mom, Sofia) → no hotspot in Phase 0
        (variants of filter-applied state not in the mockup set;
        Task 2 path documented in cover note for Operations)
  -->
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">9:41</div>

    <!-- Feed visible behind sheet (top 40% of screen). Renders just enough
         to give testers spatial continuity from mockup #5 — they should
         feel the sheet rose over the feed, not jumped to a new screen. -->
    <div class="nav-bar">
      <div class="nav-leading"></div>
      <div class="nav-title">Moments</div>
      <div class="nav-trailing">
        <div class="filter-button" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M7 12h10M10 18h4"
                  stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" />
          </svg>
        </div>
      </div>
    </div>

    <div class="scroll-area" style="padding-bottom: 0;">
      <div class="moments-grid">
        <!-- Just the first row visible behind the sheet — partial render -->
        <div class="moment-tile kind-photo">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zM5.5 17l3.5-4 2.5 3 4-5 4.5 6h-14.5z"/>
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-2">L</div>
              <div class="avatar size-18 shade-1">M</div>
            </div>
          </div>
        </div>
        <div class="moment-tile kind-letter">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="13" rx="1.5" />
              <path d="M3 8l9 6 9-6" />
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-3">A</div>
            </div>
            <span class="kind-badge">LETTER</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Scrim: tap dismisses sheet without applying filter -->
    <a href="mockup-05-moments-feed-default.html"
       class="sheet-scrim hotspot"
       aria-label="Close filter">
    </a>

    <!-- People filter sheet -->
    <div class="sheet height-60" role="dialog" aria-label="Filter by Person">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Filter by Person</div>
        <a href="mockup-05-moments-feed-default.html"
           class="sheet-cancel hotspot">Cancel</a>
      </div>
      <div class="sheet-body">

        <!-- Self row — first-among-equals per Spec #1. 'you' italic hint
             on line 2 (per primitive spec §6, row-identity variant). -->
        <div class="person-row">
          <div class="avatar size-56 shade-1">M</div>
          <div class="person-text">
            <div class="name">Maurizio</div>
            <div class="connection self-hint">you</div>
          </div>
          <div class="chevron">›</div>
        </div>

        <!-- Liza — Wife (Task 2 target — hotspot wired to mockup-07b
             as of iteration 1, 2026-05-24, per Flag #1 ratification) -->
        <a href="mockup-07b-filter-applied-liza.html"
           class="person-row hotspot"
           style="text-decoration: none; color: inherit;">
          <div class="avatar size-56 shade-2">L</div>
          <div class="person-text">
            <div class="name">Liza</div>
            <div class="connection">Wife</div>
          </div>
          <div class="chevron">›</div>
        </a>

        <!-- Alex — Brother (Task 1 target — hotspot wired) -->
        <a href="mockup-07-filter-applied-alex.html"
           class="person-row hotspot"
           style="text-decoration: none; color: inherit;">
          <div class="avatar size-56 shade-3">A</div>
          <div class="person-text">
            <div class="name">Alex</div>
            <div class="connection">Brother</div>
          </div>
          <div class="chevron">›</div>
        </a>

        <!-- Mom — Mother (exists for Task 3a 'Mom already in People list') -->
        <div class="person-row">
          <div class="avatar size-56 shade-4">M</div>
          <div class="person-text">
            <div class="name">Mom</div>
            <div class="connection">Mother</div>
          </div>
          <div class="chevron">›</div>
        </div>

        <!-- Sofia — Friend (~2-3 others per brief) -->
        <div class="person-row">
          <div class="avatar size-56 shade-5">S</div>
          <div class="person-text">
            <div class="name">Sofia</div>
            <div class="connection">Friend</div>
          </div>
          <div class="chevron">›</div>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
