<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup #7 — Moments Feed (Filter: Alex) · Arkive Phase 0</title>
  <link rel="stylesheet" href="../css/arkive-midfi.css">
  <!--
    Mockup #7 — Global Moments feed with People filter applied to Alex.
    Phase 0 mid-fi clickable prototype.

    Owner: Capsule Design Lead
    Consumes Person-chip primitive v1.1: chip-filter variant (active
      pill above feed) + chip-overlay variant in filter-active state
      (2pt ring outside avatar per spec §3, on every Alex chip in
      visible tiles).

    Test data: moments tagged to Alex, drawn from mockup #5 source set.
      Tile A — Letter to Alex (was #2 in mockup #5)
      Tile B — Letter to Alex (was #5 in mockup #5)
      Tile C — Photo tagged Alex+Liza+Maurizio+Sofia (was #7 — 3+1 overflow)
      Tile D — Letter to Alex (was #10 in mockup #5)
    Four moments total; three letters and one photo. The plural is what
    makes Task 1's answer ("Alex's letters") feel like a real population
    rather than a single-record demo.

    Per spec §3 + §7.1 (idempotent-tap rule added in v1.1.1):
      - Every Alex chip in this view renders in filter-active state
        (2pt ring outside avatar — .avatar.filter-active).
      - Tapping an Alex chip in this view is a no-op (filter already
        applied; user clears via the chip-filter × dismiss).
      - Non-Alex chips (Liza/M/Sofia on tile C) render in default state
        and would filter to themselves if tapped — but those hotspots
        aren't wired in Phase 0 (sibling-mockup gap flagged to Operations).

    Self chip rule under filter-active (CPO §4 matrix): when any People
    filter is applied, Self chip renders on every visible moment,
    including Self-only. None of the four Alex-filtered moments are
    Self-only, so the rule doesn't surface visibly here — but it's why
    Maurizio's M chip appears on tile C even though that's typical.

    Hotspot graph from this screen:
      - chip-filter × dismiss → mockup-05-moments-feed-default.html (clears filter)
      - Any tile → mockup-09-moment-detail.html (Task 1 final verification step)
      - Capsules tab → mockup-10-send-flow-recipient-empty.html
      - Filter nav-bar icon → mockup-06-people-filter-sheet.html
        (in case tester wants to change the filter target)
  -->
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">9:41</div>

    <!-- Nav bar same as mockup #5 — title + filter icon -->
    <div class="nav-bar">
      <div class="nav-leading"></div>
      <div class="nav-title">Moments</div>
      <div class="nav-trailing">
        <a href="mockup-06-people-filter-sheet.html"
           class="filter-button hotspot"
           title="Change filter"
           aria-label="Change filter">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M7 12h10M10 18h4"
                  stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" />
          </svg>
        </a>
      </div>
    </div>

    <!-- Scroll area: chip-filter pill on top, then filtered grid -->
    <div class="scroll-area">

      <!-- Active filter pill — per primitive spec §2 chip-filter variant.
           24pt Alex avatar + name + × dismiss. Tap × clears filter. -->
      <div style="padding-top:12px;">
        <a href="mockup-05-moments-feed-default.html"
           class="chip-filter hotspot"
           style="text-decoration:none;"
           title="Clear filter"
           aria-label="Clear filter">
          <div class="avatar size-24 shade-3">A</div>
          <span>Alex</span>
          <span class="dismiss">×</span>
        </a>
      </div>

      <div class="moments-grid">

        <!-- Tile A — Letter to Alex, was tile #2 in mockup #5 -->
        <a href="mockup-09-moment-detail.html"
           class="moment-tile kind-letter hotspot">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="13" rx="1.5" />
              <path d="M3 8l9 6 9-6" />
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-3 filter-active" title="Alex (active filter)">A</div>
            </div>
            <span class="kind-badge">LETTER</span>
          </div>
        </a>

        <!-- Tile B — Letter to Alex, was tile #5 in mockup #5 -->
        <a href="mockup-09-moment-detail.html"
           class="moment-tile kind-letter hotspot">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="13" rx="1.5" />
              <path d="M3 8l9 6 9-6" />
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-3 filter-active" title="Alex (active filter)">A</div>
            </div>
            <span class="kind-badge">LETTER</span>
          </div>
        </a>

        <!-- Tile C — Photo tagged Alex+Liza+Maurizio+Sofia (3+1 overflow).
             Alex avatar in filter-active state; others in default.
             Per stack order rule: tag order, Self takes natural slot. -->
        <a href="mockup-09-moment-detail.html"
           class="moment-tile kind-photo hotspot">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zM5.5 17l3.5-4 2.5 3 4-5 4.5 6h-14.5z"/>
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-3 filter-active" title="Alex (active filter)">A</div>
              <div class="avatar size-18 shade-2" title="Liza">L</div>
              <div class="avatar size-18 shade-1" title="Maurizio">M</div>
              <div class="overflow-plus" title="Sofia (1 more)">+1</div>
            </div>
          </div>
        </a>

        <!-- Tile D — Letter to Alex, was tile #10 in mockup #5 -->
        <a href="mockup-09-moment-detail.html"
           class="moment-tile kind-letter hotspot">
          <div class="tile-glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="13" rx="1.5" />
              <path d="M3 8l9 6 9-6" />
            </svg>
          </div>
          <div class="tile-bottombar">
            <div class="chip-overlay-stack chip-slot">
              <div class="avatar size-18 shade-3 filter-active" title="Alex (active filter)">A</div>
            </div>
            <span class="kind-badge">LETTER</span>
          </div>
        </a>

      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <div class="tab active">Moments</div>
      <a href="mockup-10-send-flow-recipient-empty.html"
         class="tab hotspot"
         style="display:flex; align-items:center; height:100%; padding:0 8px;">Capsules</a>
      <div class="tab">Relics</div>
      <div class="tab">Vault</div>
      <div class="tab">Profile</div>
    </div>
  </div>
</body>
</html>
