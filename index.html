<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE6">
<title>Arkive — Relic Fulfillment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --arkive-bg: #F2EDE6;
  --arkive-card: #F8F4EE;
  --arkive-parchment: #FFFAF0;
  --arkive-text: #1C1A18;
  --arkive-text-secondary: #6C665F;
  --arkive-text-tertiary: rgba(28, 26, 24, 0.45);
  --arkive-border: rgba(0, 0, 0, 0.06);
  --arkive-border-strong: rgba(0, 0, 0, 0.12);
  --arkive-accent: #9B7E5C;
  --arkive-accent-soft: rgba(155, 126, 92, 0.12);
  --arkive-accent-soft-half: rgba(155, 126, 92, 0.06);
  --arkive-green: #4C8C5A;
  --arkive-warn: #B07840;
  --arkive-error: #9C3A2A;
  --arkive-cta-fg: #FFFFFF;
  --arkive-cta-bg: #000000;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --space-12: 48px; --space-16: 64px;
  --radius-xs: 6px; --radius-sm: 8px; --radius-md: 14px;
  --radius-lg: 18px; --radius-xl: 20px; --radius-pill: 999px;
  --shadow-row-resting: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-row-hover: 0 2px 6px rgba(0, 0, 0, 0.04);
  --shadow-row-expanded: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-floating: 0 8px 24px rgba(0, 0, 0, 0.08);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 150ms; --duration-base: 220ms; --duration-slow: 350ms;
  --font-serif: "Fraunces", "Iowan Old Style", "Hoefler Text", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--arkive-bg);
  color: var(--arkive-text);
  font-family: var(--font-serif);
  font-size: 13px;
  line-height: 1.4;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}
.container { padding: var(--space-8) var(--space-6) var(--space-12); }
@media (min-width: 1024px) { .container { padding: var(--space-8) var(--space-8) var(--space-12); } }
@media (min-width: 1440px) { .container { padding: var(--space-10) var(--space-12) var(--space-12); } }

.page-header { margin-bottom: var(--space-8); }
.page-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-6);
  flex-wrap: wrap;
}
.page-title-block { flex: 1; min-width: 0; }
.page-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 500;
  font-variation-settings: "opsz" 96;
  margin: 0 0 var(--space-1);
  letter-spacing: -0.01em;
  line-height: 1.15;
  color: var(--arkive-text);
}
.page-sub {
  font-size: 13px;
  font-weight: 400;
  color: var(--arkive-text-secondary);
  margin: 0;
  line-height: 1.5;
}
.page-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
}
.toolbar {
  display: flex;
  gap: var(--space-2);
  margin-top: var(--space-5);
  flex-wrap: wrap;
  align-items: center;
}
.summary-row {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-4);
  flex-wrap: wrap;
}
.stat-pill {
  background: transparent;
  border: 1px solid var(--arkive-border);
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 12px;
  color: var(--arkive-text-secondary);
  font-weight: 500;
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}
.stat-pill strong {
  color: var(--arkive-text);
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.filter-btn {
  height: 28px;
  padding: 0 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: 1px solid var(--arkive-border);
  color: var(--arkive-text-secondary);
  transition: background-color var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}
.filter-btn:hover {
  background: var(--arkive-accent-soft-half);
  border-color: var(--arkive-border-strong);
  color: var(--arkive-text);
}
.filter-btn.active {
  background: var(--arkive-accent-soft);
  border-color: var(--arkive-accent);
  color: var(--arkive-accent);
  font-weight: 600;
}

#status {
  font-size: 12px;
  color: var(--arkive-text-secondary);
  margin-bottom: var(--space-3);
  min-height: 18px;
}
#status.error { color: var(--arkive-error); }

.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(242, 237, 230, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--arkive-accent-soft);
  border-top-color: var(--arkive-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Login modal */
.login-modal {
  position: fixed;
  inset: 0;
  background: rgba(242, 237, 230, 0.96);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: var(--space-4);
}
.login-modal.show { display: flex; }
.login-card {
  background: var(--arkive-card);
  border: 1px solid var(--arkive-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-row-expanded);
  padding: var(--space-8);
  max-width: 380px;
  width: 100%;
  text-align: center;
}
.login-card h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 500;
  font-variation-settings: "opsz" 36;
  margin: 0 0 var(--space-2);
  color: var(--arkive-text);
}
.login-card p {
  font-size: 13px;
  color: var(--arkive-text-secondary);
  margin: 0 0 var(--space-6);
}
.login-card .login-input {
  width: 100%;
  margin-bottom: var(--space-3);
  text-align: left;
}
.login-card .login-error {
  color: var(--arkive-error);
  font-size: 12px;
  margin-top: var(--space-3);
  min-height: 16px;
}

/* Order rows */
.order-row {
  position: relative;
  background: var(--arkive-card);
  border: 1px solid var(--arkive-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-row-resting);
  margin-bottom: var(--space-3);
  overflow: hidden;
  transition: box-shadow var(--duration-base) var(--ease-in-out);
}
.order-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--arkive-accent);
  border-top-left-radius: var(--radius-xl);
  border-bottom-left-radius: var(--radius-xl);
  opacity: 0;
  transition: opacity var(--duration-base) var(--ease-in-out);
  z-index: 1;
}
.order-row.is-expanded { box-shadow: var(--shadow-row-expanded); }
.order-row.is-expanded::before { opacity: 1; }
.order-row:not(.is-expanded):hover { box-shadow: var(--shadow-row-hover); }

.order-row-header {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
  background: transparent;
  border: 0;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  color: inherit;
  transition: background-color var(--duration-fast) var(--ease-out);
}
.order-row-header:hover { background: var(--arkive-accent-soft-half); }

.order-ref {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--arkive-accent);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.order-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  font-variation-settings: "opsz" 24;
  color: var(--arkive-text);
  line-height: 1.3;
  margin: 0;
  letter-spacing: -0.005em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.order-current-phase {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 500;
  color: var(--arkive-text-secondary);
  white-space: nowrap;
}
.order-current-phase strong { color: var(--arkive-text); font-weight: 600; }

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-family: var(--font-serif);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid var(--arkive-border);
  white-space: nowrap;
  font-variation-settings: "opsz" 11;
}
.chip-processing { background: var(--arkive-accent-soft); color: var(--arkive-accent); border-color: var(--arkive-accent); }
.chip-shipped { background: rgba(76, 140, 90, 0.10); color: var(--arkive-green); border-color: var(--arkive-green); }
.chip-delivered { background: rgba(76, 140, 90, 0.18); color: var(--arkive-green); border-color: var(--arkive-green); }

.order-caret {
  font-size: 18px;
  color: var(--arkive-text-tertiary);
  transition: transform var(--duration-base) var(--ease-in-out), color var(--duration-fast) var(--ease-out);
  display: inline-flex;
  width: 20px; height: 20px;
  align-items: center; justify-content: center;
}
.order-row.is-expanded .order-caret {
  transform: rotate(180deg);
  color: var(--arkive-accent);
}

.order-row-body-wrap {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--duration-base) var(--ease-in-out);
}
.order-row.is-expanded .order-row-body-wrap { grid-template-rows: 1fr; }
.order-row-body { overflow: hidden; min-height: 0; }
.order-row-body-inner {
  border-top: 1px solid var(--arkive-border);
  padding: var(--space-6);
}

/* Phase strip */
.phase-strip {
  display: flex;
  align-items: stretch;
  margin-bottom: var(--space-6);
  padding: 0 var(--space-2);
}
.phase-cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  position: relative;
  padding-bottom: var(--space-2);
}
.phase-dot-row {
  position: relative;
  width: 100%;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.phase-dot-row::before, .phase-dot-row::after {
  content: '';
  position: absolute;
  top: 50%;
  height: 1px;
  width: 50%;
  background: var(--arkive-border-strong);
  transform: translateY(-50%);
}
.phase-dot-row::before { left: 0; }
.phase-dot-row::after { right: 0; }
.phase-cell:first-child .phase-dot-row::before { display: none; }
.phase-cell:last-child .phase-dot-row::after { display: none; }
.phase-cell.line-left-green .phase-dot-row::before { background: var(--arkive-green); }
.phase-cell.line-right-green .phase-dot-row::after { background: var(--arkive-green); }

.phase-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--arkive-border-strong);
  position: relative;
  z-index: 1;
  transition: all var(--duration-base) var(--ease-out);
}
.phase-cell.is-active .phase-dot {
  width: 14px; height: 14px;
  background: var(--arkive-accent);
  border-color: var(--arkive-accent);
  animation: phase-pulse 1.6s var(--ease-in-out) infinite;
}
.phase-cell.is-completed .phase-dot {
  background: var(--arkive-green);
  border-color: var(--arkive-green);
}
.phase-cell.is-na .phase-dot {
  background: var(--arkive-border);
  border-color: var(--arkive-border-strong);
  opacity: 0.5;
}
@keyframes phase-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.phase-label {
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: 400;
  color: var(--arkive-text-secondary);
  text-align: center;
  line-height: 1.3;
  padding: 0 var(--space-1);
}
.phase-cell.is-active .phase-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--arkive-text);
}
.phase-cell.is-upcoming .phase-label { color: var(--arkive-text-tertiary); }
.phase-cell.is-na .phase-label { color: var(--arkive-text-tertiary); font-style: italic; }
.phase-ts {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--arkive-text-tertiary);
  font-variant-numeric: tabular-nums;
  text-align: center;
  line-height: 1.2;
}

.section {
  padding: var(--space-5) 0;
  border-top: 1px solid var(--arkive-border);
}
.section:first-of-type { border-top: 0; padding-top: 0; }
.section-head {
  font-family: var(--font-serif);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--arkive-text-secondary);
  margin-bottom: var(--space-3);
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
}
.section-head .head-aux {
  font-size: 11px;
  color: var(--arkive-text-tertiary);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  font-style: italic;
}

.kv {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: var(--space-2) var(--space-4);
  font-size: 13px;
}
.kv .k {
  color: var(--arkive-text-secondary);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 2px;
}
.kv .v {
  color: var(--arkive-text);
  font-weight: 400;
  line-height: 1.5;
}
.kv .v.muted { color: var(--arkive-text-secondary); }
.address-block { white-space: pre-line; line-height: 1.5; }

.completion-note {
  font-size: 13px;
  color: var(--arkive-text-secondary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.completion-note::before {
  content: '\2713';
  display: inline-block;
  width: 16px; height: 16px;
  background: var(--arkive-green);
  color: #FFFFFF;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Buttons */
.btn {
  height: 36px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  border: 0;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  white-space: nowrap;
  text-decoration: none;
}
.btn--primary { background: var(--arkive-cta-bg); color: var(--arkive-cta-fg); }
.btn--primary:hover { background: #1A1A1A; }
.btn--secondary {
  background: var(--arkive-card);
  color: var(--arkive-text);
  border: 1px solid var(--arkive-border-strong);
}
.btn--secondary:hover {
  background: var(--arkive-accent-soft);
  border-color: var(--arkive-accent);
}
.btn--tertiary {
  background: transparent;
  color: var(--arkive-accent);
  padding: 0 var(--space-2);
}
.btn--tertiary:hover { background: var(--arkive-accent-soft); }
.btn--full { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: center;
  margin-top: var(--space-3);
}

.input-text, .login-input {
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  font-family: var(--font-serif);
  font-size: 14px;
  background: var(--arkive-parchment);
  border: 1px solid var(--arkive-border-strong);
  color: var(--arkive-text);
  min-width: 220px;
  transition: border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
}
.input-text:focus, .login-input:focus {
  outline: none;
  border-color: var(--arkive-accent);
  box-shadow: 0 0 0 2px var(--arkive-accent-soft);
}
.notes-area {
  width: 100%;
  min-height: 80px;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  font-family: var(--font-serif);
  font-size: 14px;
  line-height: 1.5;
  background: var(--arkive-parchment);
  border: 1px solid var(--arkive-border-strong);
  color: var(--arkive-text);
  resize: vertical;
  transition: border-color var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
}
.notes-area:focus {
  outline: none;
  border-color: var(--arkive-accent);
  box-shadow: 0 0 0 2px var(--arkive-accent-soft);
}

.url-display {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: var(--space-3) var(--space-4);
  background: var(--arkive-parchment);
  border: 1px solid var(--arkive-border);
  border-radius: var(--radius-md);
  word-break: break-all;
  user-select: all;
  color: var(--arkive-text);
  line-height: 1.5;
}

.letter-preview {
  font-family: var(--font-serif);
  font-size: 14px;
  line-height: 1.7;
  background: var(--arkive-parchment);
  border: 1px solid var(--arkive-border);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  white-space: pre-wrap;
  color: var(--arkive-text);
}
.letter-title {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: var(--space-3);
  font-style: italic;
}

/* Photo grid — true thumbnails on GitHub Pages */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: var(--space-3);
  margin-top: var(--space-3);
}
.photo-tile {
  display: block;
  position: relative;
  aspect-ratio: 1/1;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--arkive-border);
  background: var(--arkive-parchment);
  text-decoration: none;
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
}
.photo-tile:hover {
  border-color: var(--arkive-accent);
  transform: translateY(-1px);
}
.photo-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-tile-num {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(0, 0, 0, 0.6);
  color: #FFFFFF;
  font-family: var(--font-serif);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-variant-numeric: tabular-nums;
}

.inline-msg {
  font-size: 13px;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  margin: var(--space-3) 0;
  line-height: 1.5;
}
.inline-msg.warn {
  background: rgba(176, 120, 64, 0.08);
  border: 1px solid rgba(176, 120, 64, 0.30);
  color: var(--arkive-text);
}
.inline-msg.success {
  background: rgba(76, 140, 90, 0.06);
  border: 1px solid rgba(76, 140, 90, 0.20);
  color: var(--arkive-text-secondary);
  font-size: 12px;
}
.inline-msg.error {
  background: rgba(156, 58, 42, 0.06);
  border: 1px solid rgba(156, 58, 42, 0.20);
  color: var(--arkive-error);
}

.empty {
  text-align: center;
  padding: var(--space-12) var(--space-6);
  color: var(--arkive-text-secondary);
  font-family: var(--font-serif);
  font-size: 16px;
  font-style: italic;
}

.toast {
  position: fixed;
  bottom: var(--space-6);
  left: 50%;
  transform: translateX(-50%);
  background: var(--arkive-text);
  color: var(--arkive-cta-fg);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-sm);
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-out);
  pointer-events: none;
  z-index: 200;
  box-shadow: var(--shadow-floating);
}
.toast.show { opacity: 1; }

.muted { color: var(--arkive-text-secondary); }
.tiny { font-size: 11px; }

@media (max-width: 900px) {
  .order-row-header {
    grid-template-columns: auto 1fr auto;
    grid-template-areas:
      "ref title caret"
      "phase phase chip";
    row-gap: var(--space-2);
    column-gap: var(--space-3);
  }
  .order-ref { grid-area: ref; }
  .order-title { grid-area: title; }
  .order-current-phase { grid-area: phase; font-size: 12px; }
  .order-caret { grid-area: caret; }
  .order-row-header .status-chip { grid-area: chip; justify-self: end; }
  .input-text { min-width: 0; flex: 1; }
}
@media (max-width: 700px) {
  .phase-strip { padding: 0; }
  .phase-label { font-size: 10px; }
  .phase-cell.is-active .phase-label { font-size: 11px; }
  .phase-ts { display: none; }
  .kv { grid-template-columns: 1fr; gap: 4px 0; }
  .kv .k { padding-top: var(--space-2); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
  .phase-cell.is-active .phase-dot { animation: none; }
}
</style>
</head>
<body>

<!-- Login modal (shown when no auth) -->
<div id="loginModal" class="login-modal">
  <div class="login-card">
    <h2>Arkive Fulfillment</h2>
    <p>Enter team credentials to continue</p>
    <input type="text" id="loginUser" class="login-input" placeholder="Username" autocomplete="username" autocapitalize="off" />
    <input type="password" id="loginPass" class="login-input" placeholder="Password" autocomplete="current-password" />
    <button class="btn btn--primary btn--full" onclick="doLogin()" style="margin-top: var(--space-2);">Sign in</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
</div>

<div class="container" id="appContainer" style="display: none;">
  <header class="page-header">
    <div class="page-title-row">
      <div class="page-title-block">
        <h1 class="page-title">Relic Fulfillment</h1>
        <p class="page-sub">Walk each order through the six fulfillment phases. Status updates write directly to <code>arkive_relics</code>.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn--secondary" onclick="loadAllRelics()" title="Reload orders">Refresh</button>
        <button class="btn btn--tertiary" onclick="doLogout()" title="Sign out">Sign out</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="filter-btn active" data-filter="active">Active orders</button>
      <button class="filter-btn" data-filter="all">All</button>
      <button class="filter-btn" data-filter="shipped">Shipped + delivered</button>
    </div>
    <div class="summary-row" id="summaryRow"></div>
  </header>

  <div id="status"></div>
  <div id="orders"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = 'https://skrwdjxgvryodsxusqia.supabase.co/functions/v1/arkive-fulfillment';
const AUTH_KEY = 'arkive-fulfillment-auth-v1';
const STORAGE_KEY = 'arkive-fulfillment-expanded-v2';

let allRelics = [];
let photoCache = {};
let currentFilter = 'active';
let expandedSet = restoreExpandedState();

// === Auth ===
function getAuth() {
  try { return localStorage.getItem(AUTH_KEY); } catch (e) { return null; }
}
function setAuth(headerValue) {
  try { localStorage.setItem(AUTH_KEY, headerValue); } catch (e) {}
}
function clearAuth() {
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
}
function showLogin() {
  document.getElementById('loginModal').classList.add('show');
  document.getElementById('appContainer').style.display = 'none';
  setTimeout(() => { document.getElementById('loginUser').focus(); }, 100);
}
function hideLogin() {
  document.getElementById('loginModal').classList.remove('show');
  document.getElementById('appContainer').style.display = 'block';
}
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'Username and password required'; return; }
  const headerValue = 'Basic ' + btoa(u + ':' + p);
  setAuth(headerValue);
  try {
    showLoading(true);
    const data = await apiCall('/api/list', {});
    allRelics = data.relics || [];
    hideLogin();
    document.getElementById('loginPass').value = '';
    if (expandedSet.size === 0 && allRelics.length > 0) {
      const firstActive = allRelics.find(r => !r.delivered_at);
      if (firstActive) { expandedSet.add(firstActive.id); persistExpandedState(); }
    }
    renderSummary();
    renderOrders();
    setStatus(`Loaded ${allRelics.length} order${allRelics.length === 1 ? '' : 's'}.`);
  } catch (e) {
    clearAuth();
    errEl.textContent = (e.status === 401) ? 'Invalid credentials' : ('Sign-in failed: ' + (e.message || 'unknown'));
  } finally {
    showLoading(false);
  }
}
function doLogout() {
  clearAuth();
  allRelics = [];
  document.getElementById('orders').innerHTML = '';
  document.getElementById('summaryRow').innerHTML = '';
  setStatus('');
  showLogin();
}
async function apiCall(endpoint, body) {
  const auth = getAuth();
  if (!auth) { showLogin(); throw Object.assign(new Error('Not authenticated'), { status: 401 }); }
  const resp = await fetch(API_BASE + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': auth },
    body: JSON.stringify(body || {})
  });
  if (resp.status === 401) {
    clearAuth();
    showLogin();
    throw Object.assign(new Error('Session expired — sign in again'), { status: 401 });
  }
  if (!resp.ok) {
    let msg = 'API error: ' + resp.status;
    try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw Object.assign(new Error(msg), { status: resp.status });
  }
  return await resp.json();
}

// === UI helpers ===
function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = isError ? 'error' : '';
}
function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('show', !!show);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// === Data ===
async function loadAllRelics() {
  if (!getAuth()) { showLogin(); return; }
  showLoading(true);
  setStatus('Loading orders…');
  try {
    const data = await apiCall('/api/list', {});
    allRelics = data.relics || [];
    if (expandedSet.size === 0 && allRelics.length > 0) {
      const firstActive = allRelics.find(r => !r.delivered_at);
      if (firstActive) { expandedSet.add(firstActive.id); persistExpandedState(); }
    }
    renderSummary();
    renderOrders();
    setStatus(`Loaded ${allRelics.length} order${allRelics.length === 1 ? '' : 's'}.`);
  } catch (e) {
    if (e.status !== 401) setStatus('Failed to load: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

function renderSummary() {
  const sumRow = document.getElementById('summaryRow');
  const total = allRelics.length;
  const inProcessing = allRelics.filter(r => !r.shipped_at).length;
  const shipped = allRelics.filter(r => r.shipped_at && !r.delivered_at).length;
  const delivered = allRelics.filter(r => r.delivered_at).length;
  sumRow.innerHTML = `
    <div class="stat-pill"><strong>${total}</strong> total</div>
    <div class="stat-pill"><strong>${inProcessing}</strong> in production</div>
    <div class="stat-pill"><strong>${shipped}</strong> shipped</div>
    <div class="stat-pill"><strong>${delivered}</strong> delivered</div>
  `;
}

function renderOrders() {
  const container = document.getElementById('orders');
  let filtered;
  if (currentFilter === 'active') filtered = allRelics.filter(r => !r.delivered_at);
  else if (currentFilter === 'shipped') filtered = allRelics.filter(r => r.shipped_at);
  else filtered = allRelics;
  if (filtered.length === 0) { container.innerHTML = `<div class="empty">No orders match this filter.</div>`; return; }
  container.innerHTML = filtered.map(renderCard).join('');
  bindCardEvents();
}

function formatOrderRef(uuid) {
  const seg = (uuid || '').replace(/-/g, '').slice(0, 8).toUpperCase();
  return `${seg.slice(0,4)}-${seg.slice(4,8)}`;
}
function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function fmtDateTime(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtPrice(p, c) {
  const n = parseFloat(p || 0);
  const sym = c === 'EUR' ? '€' : c === 'USD' ? '$' : (c + ' ');
  return sym + n.toFixed(2);
}
function statusChip(r) {
  if (r.delivered_at) return `<span class="status-chip chip-delivered">Delivered</span>`;
  if (r.shipped_at) return `<span class="status-chip chip-shipped">Shipped</span>`;
  return `<span class="status-chip chip-processing">${escapeHtml(r.order_status || 'Processing')}</span>`;
}
function computePhases(r) {
  return [
    { label: 'Photos printed', ts: r.photos_printed_at, applicable: true },
    { label: r.has_letter ? 'Letter printed' : 'Letter (n/a)', ts: r.letter_printed_at, applicable: !!r.has_letter },
    { label: 'NFC encoded', ts: r.nfc_encoded_at, applicable: true },
    { label: 'Sealed', ts: r.sealed_at, applicable: true },
    { label: 'Shipped', ts: r.shipped_at, applicable: true },
    { label: 'Delivered', ts: r.delivered_at, applicable: true },
  ];
}
function findActivePhase(phases) {
  for (let i = 0; i < phases.length; i++) {
    if (phases[i].applicable && !phases[i].ts) return i;
  }
  return -1;
}
function phaseStateClass(phase, i, activeIdx) {
  if (!phase.applicable) return 'is-na';
  if (phase.ts) return 'is-completed';
  if (i === activeIdx) return 'is-active';
  return 'is-upcoming';
}
function renderPhaseStrip(phases, activeIdx) {
  return `<div class="phase-strip">${phases.map((p, i) => {
    const stateClass = phaseStateClass(p, i, activeIdx);
    const lineLeftGreen = i > 0 && (activeIdx === -1 || (i - 1) < activeIdx);
    const lineRightGreen = activeIdx === -1 ? (i < phases.length - 1) : (i < activeIdx);
    const cellClasses = ['phase-cell', stateClass];
    if (lineLeftGreen) cellClasses.push('line-left-green');
    if (lineRightGreen) cellClasses.push('line-right-green');
    const tsLabel = p.ts ? fmtDate(p.ts) : '';
    return `
      <div class="${cellClasses.join(' ')}">
        <div class="phase-dot-row"><span class="phase-dot"></span></div>
        <div class="phase-label">${escapeHtml(p.label)}</div>
        ${tsLabel ? `<div class="phase-ts">${escapeHtml(tsLabel)}</div>` : ''}
      </div>
    `;
  }).join('')}</div>`;
}
function currentPhaseSummary(phases, activeIdx) {
  if (activeIdx === -1) return `<strong>All phases complete</strong>`;
  const num = activeIdx + 1;
  const label = phases[activeIdx].label;
  return `Phase ${num} · <strong>${escapeHtml(label)}</strong>`;
}

function renderCard(r) {
  const orderRef = formatOrderRef(r.id);
  const isExpanded = expandedSet.has(r.id);
  const phases = computePhases(r);
  const activeIdx = findActivePhase(phases);
  const chosenLetter = r.chosen_letter || (r.letter_content_snapshot ? { id:'snapshot', title:'(from order-time snapshot)', body: r.letter_content_snapshot, sort_index: 0 } : null);
  const letterSource = r.chosen_letter ? 'capsule' : (r.letter_content_snapshot ? 'snapshot' : 'none');
  const giftRecipient = r.shipping_recipient_full_name || r.recipient_name || '—';
  const address = [
    r.shipping_street,
    [r.shipping_postal_code, r.shipping_city].filter(Boolean).join(' '),
    r.shipping_country
  ].filter(Boolean).join('\n');

  return `
  <div class="order-row ${isExpanded ? 'is-expanded' : ''}" data-id="${escapeHtml(r.id)}" id="order-${escapeHtml(r.id)}">
    <button class="order-row-header" data-action="toggle" data-id="${escapeHtml(r.id)}" aria-expanded="${isExpanded}">
      <span class="order-ref">${orderRef}</span>
      <span class="order-title">${escapeHtml(r.capsule_title || 'Untitled capsule')}</span>
      <span class="order-current-phase">${currentPhaseSummary(phases, activeIdx)}</span>
      ${statusChip(r)}
      <span class="order-caret" aria-hidden="true">▾</span>
    </button>
    <div class="order-row-body-wrap">
      <div class="order-row-body">
        <div class="order-row-body-inner">
          ${renderPhaseStrip(phases, activeIdx)}

          <div class="section">
            <div class="section-head">Order info</div>
            <div class="kv">
              <div class="k">Purchaser</div>
              <div class="v">${escapeHtml(r.purchaser_name || '')} <span class="muted">&lt;${escapeHtml(r.purchaser_email || '')}&gt;</span></div>
              <div class="k">Gift recipient</div>
              <div class="v">${escapeHtml(giftRecipient)}</div>
              <div class="k">Shipping</div>
              <div class="v address-block">${escapeHtml(address)}</div>
              <div class="k">Phone</div>
              <div class="v">${escapeHtml(r.shipping_phone || '—')}</div>
              <div class="k">Photos / Letter</div>
              <div class="v">${r.photo_count} photo${r.photo_count === 1 ? '' : 's'}${r.has_letter ? ' + letter' : ' (no letter)'}</div>
              <div class="k">Ordered</div>
              <div class="v">${fmtDate(r.ordered_at)} · ${fmtPrice(r.price, r.currency)}</div>
              <div class="k">Confirmation email</div>
              <div class="v">${r.confirmation_email_sent_at ? '✓ sent ' + fmtDateTime(r.confirmation_email_sent_at) : '<span class="muted">not sent yet</span>'}</div>
            </div>
          </div>

          <div class="section">
            <div class="section-head">Phase 2 — Photos for print partner</div>
            ${r.photos_printed_at
              ? `<div class="completion-note">Marked printed ${fmtDate(r.photos_printed_at)}</div>`
              : `<div class="actions" id="photo-actions-${escapeHtml(r.id)}">
                  <button class="btn btn--primary" data-action="mark" data-field="photos_printed_at" data-id="${escapeHtml(r.id)}">Mark photos printed</button>
                  <button class="btn btn--secondary" data-action="load-photos" data-id="${escapeHtml(r.id)}">Load photos</button>
                </div>
                <div id="photos-${escapeHtml(r.id)}"></div>`
            }
          </div>

          ${r.has_letter ? `
          <div class="section">
            <div class="section-head">Phase 3 — Letter for print partner ${letterSource === 'snapshot' ? '<span class="head-aux">from snapshot</span>' : ''}</div>
            ${chosenLetter
              ? `<div class="letter-preview"><div class="letter-title">${escapeHtml(chosenLetter.title || 'Untitled letter')}</div>${escapeHtml(chosenLetter.body || '')}</div>`
              : `<div class="muted tiny">No letter content found. letter_id=${escapeHtml(r.letter_id || 'null')}, capsule had no matching item, no snapshot available.</div>`
            }
            ${r.letter_printed_at
              ? `<div class="completion-note" style="margin-top:var(--space-3);">Marked printed ${fmtDate(r.letter_printed_at)}</div>`
              : `<div class="actions">
                  <button class="btn btn--primary" data-action="mark" data-field="letter_printed_at" data-id="${escapeHtml(r.id)}">Mark letter printed</button>
                  <button class="btn btn--secondary" data-action="copy-letter" data-id="${escapeHtml(r.id)}">Copy letter text</button>
                </div>`
            }
          </div>
          ` : ''}

          <div class="section">
            <div class="section-head">Phase 4 — NFC card</div>
            <div class="muted tiny" style="margin-bottom:var(--space-2);">Copy this URL into NFC Tools / TagWriter on your phone, write to a blank NFC card, then mark encoded.</div>
            <div class="url-display">${escapeHtml(r.nfc_deep_link || '')}</div>
            ${r.nfc_encoded_at
              ? `<div class="completion-note" style="margin-top:var(--space-3);">Marked encoded ${fmtDate(r.nfc_encoded_at)}</div>`
              : `<div class="actions">
                  <button class="btn btn--primary" data-action="mark" data-field="nfc_encoded_at" data-id="${escapeHtml(r.id)}">Mark NFC encoded</button>
                  <button class="btn btn--secondary" data-action="copy-nfc" data-id="${escapeHtml(r.id)}">Copy URL</button>
                </div>`
            }
          </div>

          <div class="section">
            <div class="section-head">Phase 5 — Seal &amp; assemble</div>
            ${r.sealed_at
              ? `<div class="completion-note">Marked sealed ${fmtDate(r.sealed_at)}</div>`
              : `<div class="actions">
                  <button class="btn btn--primary" data-action="mark" data-field="sealed_at" data-id="${escapeHtml(r.id)}">Mark sealed</button>
                </div>`
            }
          </div>

          <div class="section">
            <div class="section-head">Phase 6 — Ship &amp; track</div>
            ${r.shipped_at ? `
              <div class="kv">
                <div class="k">Shipped</div>
                <div class="v">${fmtDate(r.shipped_at)}</div>
                <div class="k">Tracking #</div>
                <div class="v">${escapeHtml(r.tracking_number || '—')}</div>
                <div class="k">Delivered</div>
                <div class="v">${r.delivered_at ? '✓ ' + fmtDate(r.delivered_at) : '<span class="muted">not yet</span>'}</div>
              </div>
              ${!r.delivered_at ? `<div class="actions"><button class="btn btn--primary" data-action="mark" data-field="delivered_at" data-id="${escapeHtml(r.id)}">Mark delivered</button></div>` : ''}
            ` : `
              <div class="actions">
                <input type="text" class="input-text" placeholder="Tracking #" id="tracking-${escapeHtml(r.id)}" />
                <button class="btn btn--primary" data-action="ship" data-id="${escapeHtml(r.id)}">Mark shipped</button>
              </div>
            `}
          </div>

          <div class="section">
            <div class="section-head">Notes</div>
            <textarea class="notes-area" data-action="notes" data-id="${escapeHtml(r.id)}" placeholder="Free-form notes for the team (reprints, NFC retries, partner-side issues, etc.)">${escapeHtml(r.fulfillment_notes || '')}</textarea>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function bindCardEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      if (ev.target.closest('button[data-action]:not([data-action="toggle"]), input, textarea, a, .input-text')) return;
      toggleExpanded(btn.dataset.id);
    });
  });
  document.querySelectorAll('.order-row-body button, .order-row-body input, .order-row-body textarea, .order-row-body a').forEach(el => {
    el.addEventListener('click', (ev) => ev.stopPropagation());
  });
  document.querySelectorAll('[data-action="mark"]').forEach(btn => {
    btn.addEventListener('click', () => markPhase(btn.dataset.id, btn.dataset.field));
  });
  document.querySelectorAll('[data-action="ship"]').forEach(btn => {
    btn.addEventListener('click', () => markShipped(btn.dataset.id));
  });
  document.querySelectorAll('[data-action="load-photos"]').forEach(btn => {
    btn.addEventListener('click', () => loadPhotos(btn.dataset.id));
  });
  document.querySelectorAll('[data-action="copy-nfc"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = allRelics.find(x => x.id === btn.dataset.id);
      copyToClipboard(r && r.nfc_deep_link || '');
    });
  });
  document.querySelectorAll('[data-action="copy-letter"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = allRelics.find(x => x.id === btn.dataset.id);
      const chosen = (r && r.chosen_letter) || (r && r.letter_content_snapshot ? { title:'', body:r.letter_content_snapshot } : null);
      if (!chosen) { showToast('No letter content to copy'); return; }
      copyToClipboard((chosen.title ? chosen.title + '\n\n' : '') + (chosen.body || ''));
    });
  });
  document.querySelectorAll('[data-action="notes"]').forEach(ta => {
    ta.addEventListener('blur', () => saveNotes(ta.dataset.id, ta.value));
  });
}

function toggleExpanded(relicId) {
  const row = document.getElementById('order-' + relicId);
  if (!row) return;
  const wasExpanded = row.classList.contains('is-expanded');
  if (wasExpanded) {
    row.classList.remove('is-expanded');
    expandedSet.delete(relicId);
    const headerBtn = row.querySelector('[data-action="toggle"]');
    if (headerBtn) headerBtn.setAttribute('aria-expanded', 'false');
  } else {
    row.classList.add('is-expanded');
    expandedSet.add(relicId);
    const headerBtn = row.querySelector('[data-action="toggle"]');
    if (headerBtn) headerBtn.setAttribute('aria-expanded', 'true');
    setTimeout(() => {
      const top = row.getBoundingClientRect().top + window.scrollY;
      const target = top - 48;
      window.scrollTo({ top: target < 0 ? 0 : target, behavior: 'smooth' });
    }, 60);
  }
  persistExpandedState();
}

function persistExpandedState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...expandedSet])); } catch (e) {}
}
function restoreExpandedState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return new Set(JSON.parse(saved));
  } catch (e) {}
  return new Set();
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('Copied to clipboard'); }
    catch (e) { showToast('Copy failed'); }
    document.body.removeChild(ta);
  }
}

async function markPhase(relicId, field) {
  showLoading(true);
  setStatus('Marking ' + field + '…');
  try {
    await apiCall('/api/update', { relic_id: relicId, field });
    await loadAllRelics();
    showToast('Updated');
  } catch (e) {
    if (e.status !== 401) setStatus('Update failed: ' + e.message, true);
    showLoading(false);
  }
}

async function markShipped(relicId) {
  const trackingInput = document.getElementById('tracking-' + relicId);
  const tracking = (trackingInput && trackingInput.value || '').trim();
  if (!tracking) { setStatus('Enter a tracking number first.', true); return; }
  showLoading(true);
  setStatus('Marking shipped…');
  try {
    await apiCall('/api/update', { relic_id: relicId, ship_with_tracking: tracking });
    await loadAllRelics();
    showToast('Shipped');
  } catch (e) {
    if (e.status !== 401) setStatus('Update failed: ' + e.message, true);
    showLoading(false);
  }
}

async function saveNotes(relicId, value) {
  try {
    await apiCall('/api/update', { relic_id: relicId, notes: value });
    showToast('Notes saved');
  } catch (e) {
    if (e.status !== 401) setStatus('Notes save failed: ' + e.message, true);
  }
}

async function loadPhotos(relicId) {
  const container = document.getElementById('photos-' + relicId);
  if (!container) return;
  container.innerHTML = `<div class="muted tiny" style="margin-top:var(--space-3);">Generating signed URLs…</div>`;
  try {
    const data = await apiCall('/api/photos', { relic_id: relicId });
    const photos = data.photos || [];
    const meta = data.photos_meta || {};
    if (photos.length === 0) {
      container.innerHTML = `<div class="inline-msg">No photos found for this order.</div>`;
      return;
    }
    photoCache[relicId] = { photos, expires_at: Date.now() + 3500 * 1000 };
    const totalInCapsule = meta.total_in_capsule || photos.length;
    const expectedCount = meta.expected_count || photos.length;
    const warning = meta.selection_unknown ? `
      <div class="inline-msg warn">
        <strong>Legacy order — photo selection wasn't captured at order time.</strong>
        This Relic was placed before 2026-05-06, when the iOS app started persisting customer selections.
        Capsule contains <strong>${totalInCapsule}</strong> photo${totalInCapsule === 1 ? '' : 's'}; customer ordered <strong>${expectedCount}</strong> for printing.
        Send all <strong>${totalInCapsule}</strong> photos to the print partner OR coordinate with the customer to identify the ${expectedCount} they wanted.
      </div>` : `
      <div class="inline-msg success">
        ✓ Showing ${photos.length} customer-selected photo${photos.length === 1 ? '' : 's'} (filtered from ${totalInCapsule} in capsule). Signed URLs valid 1 hour.
      </div>`;
    container.innerHTML = `
      ${warning}
      <div class="actions" style="margin-top:var(--space-3);">
        <button class="btn btn--secondary" onclick="downloadAllPhotos('${escapeHtml(relicId)}')">Download all (sequential)</button>
        <button class="btn btn--secondary" onclick="copyAllPhotoUrls('${escapeHtml(relicId)}')">Copy all URLs</button>
      </div>
      <div class="photo-grid">
        ${photos.map((p, i) => `
          <a class="photo-tile" href="${escapeHtml(p.signed_url || '')}" target="_blank" rel="noopener" download="photo-${(i+1).toString().padStart(2,'0')}.jpg" title="Click to open + download photo ${i+1}">
            <img src="${escapeHtml(p.signed_url || '')}" alt="Photo ${i+1}" loading="lazy" />
            <span class="photo-tile-num">${i+1}</span>
          </a>
        `).join('')}
      </div>
    `;
  } catch (e) {
    if (e.status !== 401) container.innerHTML = `<div class="inline-msg error">Failed: ${escapeHtml(e.message)}</div>`;
  }
}

window.copyAllPhotoUrls = function(relicId) {
  const cache = photoCache[relicId];
  if (!cache) { showToast('Load photos first.'); return; }
  const urls = cache.photos.map((p, i) => `${(i+1).toString().padStart(2,'0')}: ${p.signed_url || ''}`).join('\n');
  copyToClipboard(urls);
};

window.downloadAllPhotos = async function(relicId) {
  const cache = photoCache[relicId];
  if (!cache) { showToast('Load photos first.'); return; }
  showToast(`Triggering ${cache.photos.length} downloads…`);
  for (let i = 0; i < cache.photos.length; i++) {
    const p = cache.photos[i];
    if (!p.signed_url) continue;
    const a = document.createElement('a');
    a.href = p.signed_url;
    a.download = `photo-${(i+1).toString().padStart(2,'0')}.jpg`;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    await new Promise(r => setTimeout(r, 400));
  }
  showToast('All download triggers fired.');
};

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderOrders();
  });
});

// Allow Enter key on login form
document.getElementById('loginPass').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') doLogin();
});
document.getElementById('loginUser').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') document.getElementById('loginPass').focus();
});

// Boot
if (getAuth()) {
  hideLogin();
  loadAllRelics();
} else {
  showLogin();
}
</script>
